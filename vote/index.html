<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta property="og:title" content="멸망전 시즌2 투표 바로가기">
<meta property="og:description" content="박이언 · 스맵임 · 김민교. · 밍주인데요 · 성훈- 투표하러 가기">
<title>멸망전 시즌2 투표 바로가기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0d1020;--card:#171b33;--line:#2a3058;--txt:#eef0ff;--sub:#9aa3d6;--acc:#1559ff;--ok:#22c38e}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:'Noto Sans KR',system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:28px 16px 48px}
  .wrap{width:100%;max-width:460px}
  h1{font-size:24px;font-weight:900;line-height:1.3}
  .sub{color:var(--sub);font-size:14px;margin:8px 0 20px;line-height:1.6}
  .how{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:13.5px;line-height:1.7;color:var(--sub);margin-bottom:18px}
  .how b{color:var(--txt)}
  a.row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px;text-decoration:none;color:var(--txt);transition:transform .08s,border-color .2s}
  a.row:active{transform:scale(.98)}
  .pos{flex:none;width:58px;height:58px;border-radius:12px;background:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px}
  .name{font-size:20px;font-weight:700}
  .hint{font-size:12.5px;color:var(--sub);margin-top:2px}
  .go{margin-left:auto;font-size:22px;color:var(--sub)}
  a.row.done{border-color:var(--ok)}
  a.row.done .pos{background:var(--ok)}
  a.row.done .go::after{content:'✓';color:var(--ok)}
  a.row.done .go span{display:none}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#fff;color:#111;font-weight:700;font-size:14px;padding:10px 16px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .all{width:100%;border:0;border-radius:16px;background:var(--acc);color:#fff;font:inherit;font-weight:900;font-size:17px;padding:16px;cursor:pointer;margin-bottom:6px}
  .all:active{transform:scale(.98)}
  .allhint{font-size:12px;color:var(--sub);text-align:center;margin-bottom:16px}
  .foot{color:var(--sub);font-size:12px;text-align:center;margin-top:18px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <h1>Whiff 2026 LoL 멸망전 시즌2<br>투표 바로가기</h1>
  <p class="sub">포지션별로 하루 1번씩 투표할 수 있어요 · 11/24(화) 22:00까지</p>

  <div class="how">
    ① 버튼을 누르면 <b>투표 페이지가 열리고 이름이 복사돼요</b><br>
    ② 페이지 위쪽 <b>검색창에 붙여넣기</b> → 이름 체크 → <b>투표하기</b><br>
    ③ 돌아와서 다음 포지션도 똑같이! (SOOP 로그인 필요)
  </div>

  <button id="all" class="all">5개 페이지 한 번에 열기</button>
  <p class="allhint">안 열리면 주소창의 '팝업 차단' 아이콘 → 항상 허용 후 다시 눌러주세요</p>
  <div id="list"></div>

  <p class="foot">누른 버튼은 초록색으로 표시돼요 (이 기기에서만)</p>
</div>
<div class="toast" id="toast"></div>

<script>
const P=[
  ['TOP','박이언',141],
  ['JUG','스맵임',143],
  ['MID','김민교.',145],
  ['ADC','밍주인데요',147],
  ['SUP','성훈-',149]
];
const day=new Date().toLocaleDateString('ko-KR');
let done={};
try{const s=JSON.parse(localStorage.getItem('votedone')||'{}');if(s.day===day)done=s.v||{};}catch(e){}
const save=()=>{try{localStorage.setItem('votedone',JSON.stringify({day,v:done}))}catch(e){}};
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800)};
const list=document.getElementById('list');
P.forEach(([pos,name,idx])=>{
  const a=document.createElement('a');
  a.className='row'+(done[idx]?' done':'');
  a.href='https://gamevote.sooplive.com/?idx='+idx;
  a.target='_blank';a.rel='noopener';
  a.innerHTML=`<div class="pos">${pos}</div><div><div class="name">${name}</div><div class="hint">눌러서 투표하러 가기</div></div><div class="go"><span>›</span></div>`;
  a.addEventListener('click',()=>{
    try{navigator.clipboard.writeText(name).then(()=>toast(`'${name}' 복사됨 · 검색창에 붙여넣기`),()=>toast(`검색창에 '${name}' 검색`))}catch(e){toast(`검색창에 '${name}' 검색`)}
    done[idx]=1;save();a.classList.add('done');
  });
  list.appendChild(a);
});
document.getElementById('all').addEventListener('click',()=>{
  let n=0;
  P.forEach(([pos,name,idx])=>{const w=window.open('https://gamevote.sooplive.com/?idx='+idx,'_blank');if(w)n++;});
  toast(n===5?'5개 열림! 탭마다 이름 검색해서 투표':'팝업이 막혔어요 · 팝업 허용 후 다시');
});
</script>
</body>
</html>
